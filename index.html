<!-- Hub v1.2.0 - deployed 6 Nov 2026 -->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
    --deemph: #d3d2cb; --track: #cde2fb; --up: #006300; --down: #b42318; --red: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    position: relative; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 16px; }
  .app-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .app-name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .app-ver { font-size: 12px; color: var(--muted); }

  .section-title { font-size: 18px; font-weight: 700; margin: 28px 0 10px; }
  .section-title:first-of-type { margin-top: 4px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  .card .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-2 > .card { margin-bottom: 0; }
  .grid-2 + .card, .grid-2 + .grid-2 { margin-top: 14px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 8px 16px; font: inherit; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--ring); }
  .seg button.on { background: var(--ink); color: #fff; }
  .btn { border: 1px solid var(--ring); background: var(--surface); border-radius: 9px; padding: 8px 12px; font: inherit; color: var(--ink); cursor: pointer; }
  .btn:hover { background: #f0efec; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .period-label { font-weight: 600; min-width: 180px; text-align: center; }
  .link { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; color: var(--s1); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
  .tile .t-label { font-size: 13px; color: var(--ink-2); }
  .tile .t-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .tile .t-value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
  .tile .t-sub { font-size: 14px; color: var(--ink); font-weight: 500; }
  .tile .t-delta { font-size: 12px; }
  .tile .t-delta.up { color: var(--up); } .tile .t-delta.down { color: var(--down); } .tile .t-delta.flat { color: var(--muted); }
  .tile .t-note { font-size: 11px; color: var(--muted); }
  .meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 6px 0 2px; }
  .meter span { display: block; height: 100%; background: var(--s1); border-radius: 4px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
  svg text { font-family: inherit; }
  .card svg { max-width: 100%; height: auto; display: block; }
  .grid-2 > .card { min-width: 0; }
  .hit { fill: transparent; cursor: default; }
  .hit-g .xh { opacity: 0; }
  .hit-g:hover .xh { opacity: 1; }
  .bar-mark { transition: opacity 0.1s; }
  .hit-g:hover .bar-mark { opacity: 0.8; }

  .segbar { display: flex; gap: 2px; height: 28px; margin: 6px 0 8px; }
  .segbar div { border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: visible; min-width: 0; }

  .rank { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; align-items: center; gap: 8px 12px; }
  .rank .r-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .r-track { height: 14px; }
  .rank .r-track span { display: block; height: 14px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .rank .r-val { font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rank .r-val b { color: var(--ink); }

  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #efeee9; white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; }
  tr.total td { font-weight: 700; border-top: 1px solid var(--grid); border-bottom: 0; }
  .nr { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); padding: 6px 0; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f0efec; color: var(--ink-2); }

  .pipe-head { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 4px; }
  .pipe-head .big { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
  .pipe-head .lbl { font-size: 13px; color: var(--ink-2); }
  .stage-row { display: grid; grid-template-columns: minmax(170px, 1.1fr) 2fr 52px 96px 16px; align-items: center; gap: 12px;
               padding: 7px 4px; border-bottom: 1px solid #efeee9; cursor: pointer; }
  .stage-row:hover { background: #f4f3ef; }
  .stage-row .s-name { display: flex; align-items: center; gap: 8px; }
  .stage-row .s-name i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .stage-row .s-bar span { display: block; height: 12px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .stage-row .s-count { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stage-row .s-val { text-align: right; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .stage-row [data-arrow] { color: var(--muted); transition: transform 0.15s; }
  .stage-row.open [data-arrow] { transform: rotate(90deg); }
  .stage-jobs { padding: 6px 0 12px; }

  .stale { opacity: 0.45; pointer-events: none; transition: opacity 0.15s; }
  .gate { text-align: center; padding: 60px 16px; color: var(--ink-2); }
  .err { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .loading { color: var(--muted); padding: 8px 0; }

  #tip { display: none; position: absolute; z-index: 60; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
         box-shadow: 0 6px 20px rgba(0,0,0,0.10); border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 140px; }
  #tip .tt { color: var(--ink-2); margin-bottom: 4px; }
  #tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  #tip .tr b { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  #tip .tr span { color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  #tip .tr i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
  #toast { display: none; position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: #111827; color: #fff;
           padding: 10px 16px; border-radius: 8px; z-index: 50; font-size: 13px; }

  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } .grid-2 > .card { margin-bottom: 0; } }
  @media (max-width: 560px) {
    .wrap { padding: 12px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile .t-value { font-size: 28px; }
    .stage-row { grid-template-columns: 1fr 44px 84px 16px; }
    .stage-row .s-bar { display: none; }
    .period-label { min-width: 0; }
    .rank { grid-template-columns: 90px 1fr; }
    .rank .r-val { grid-column: 1 / -1; margin: -4px 0 6px; }
  }

  .app-view { margin-left: auto; font-size: 12px; color: var(--ink-2); background: #f0efec; border-radius: 999px; padding: 3px 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .card-head > div:first-child { flex: 1 1 180px; min-width: 0; }
  .vsw { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; flex: none; }
  .vsw button { border: 0; background: transparent; padding: 4px 10px; font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .vsw button + button { border-left: 1px solid var(--ring); }
  .vsw button.on { background: #f0efec; color: var(--ink); font-weight: 600; }
  .pie-wrap { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .pie-legend { display: grid; gap: 6px; min-width: 220px; }
  .pie-row { display: grid; grid-template-columns: 12px 1fr 50px 44px; align-items: center; gap: 8px; font-size: 13px; }
  .pie-row i { width: 10px; height: 10px; border-radius: 3px; }
  .pie-row b { text-align: right; font-variant-numeric: tabular-nums; }
  .pie-row em { text-align: right; font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
  .data-note { font-size: 12px; color: var(--muted); margin: 8px 2px 14px; }
  .t-none { font-size: 20px; color: var(--muted); font-weight: 500; }
  .tiles .tile .t-label { min-height: 18px; }
</style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="gate">Open Hub from Helm to see your dashboard.</div>
  </div>
  <div id="tip"></div>
  <div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Hub: the dashboard app for HELM. Spec: claude/hub-mi-spec.md in the HELM Troubleshooter project.
   v1.2.0: widget framework. Each widget answers one question and offers only the chart types
   that suit its data. The chosen type is kept on the device per user.
   Views by Helm tick box: hub-exec, hub-sales, hub-office, hub-warehouse, hub-finance.
   Super admins (admin) can open every view. Only the CEO view is built so far.
   Read only. Reads Scout leads and lead_activity. Writes nothing except its module_versions row.
   ═══════════════════════════════════════════════════════════════════ */
const APP_VERSION = 'v1.2.0';
const MODULE_KEY  = 'hub';

/* ── Scout project (read only) ── */
const SCOUT_URL = 'https://vrujksjomkvbgwxbywzx.supabase.co';
const SCOUT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZydWprc2pvbWt2Ymd3eGJ5d3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTAxODUsImV4cCI6MjEwMDgyNjE4NX0.WAnLBFU7YXfJWHe6k_WjQzszMEgAJP0UbzuAim43GP4';

async function sbScout(path, opts = {}) {
  const { prefer, ...fetchOpts } = opts;
  const res = await fetch(`${SCOUT_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SCOUT_KEY,
      'Authorization': `Bearer ${SCOUT_KEY}`,
      'Content-Type': 'application/json',
      ...(prefer ? { 'Prefer': prefer } : {}),
    },
    ...fetchOpts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `SB error ${res.status}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
const scoutGet = (table, qs = '') => sbScout(`${table}?${qs}`);

/* ── Version reporting to Helm ── */
fetch('https://xjnrmltfruzwmnhxplzn.supabase.co/rest/v1/module_versions', {
  method: 'POST',
  headers: {
    'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqbnJtbHRmcnV6d21uaHhwbHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzMxNTAsImV4cCI6MjEwMDkwOTE1MH0.oDGbg7nGByR2ppjn8tYhTAz3tjUjPQkegbu40OH6Oq8',
    'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqbnJtbHRmcnV6d21uaHhwbHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzMxNTAsImV4cCI6MjEwMDkwOTE1MH0.oDGbg7nGByR2ppjn8tYhTAz3tjUjPQkegbu40OH6Oq8',
    'Content-Type': 'application/json',
    'Prefer': 'resolution=merge-duplicates',
  },
  body: JSON.stringify({ module: MODULE_KEY, version: APP_VERSION, updated_at: new Date().toISOString() }),
}).catch(() => {});


/* ── Helpers ── */
function g(id) { return document.getElementById(id); }
function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function toast(msg, type = '') {
  const el = g('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}
const NR = '<span class="nr">Not recorded</span>';
function money(n) { return '£' + Math.round(Number(n) || 0).toLocaleString('en-GB'); }
function moneyShort(n) {
  const v = Math.round(Number(n) || 0);
  if (v >= 1000000) return '£' + (v / 1000000).toFixed(v >= 10000000 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (v >= 10000) return '£' + Math.round(v / 1000) + 'K';
  return '£' + v.toLocaleString('en-GB');
}
function moneyOrNr(n) { return n == null || n === '' ? NR : esc(money(n)); }
function dateShort(iso) {
  if (!iso) return NR;
  const d = new Date(iso);
  if (isNaN(d)) return NR;
  return esc(d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }));
}
function dateTime(iso) {
  if (!iso) return NR;
  const d = new Date(iso);
  return esc(d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' +
             d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));
}
function custName(l) {
  const n = [l.first_name, l.last_name].filter(Boolean).join(' ').trim();
  return n || 'No name';
}
function jobId(l) { return l.job_id ? esc(l.job_id) : NR; }
function surveyor(l) { return l.salesperson ? esc(l.salesperson) : NR; }
function surveyDate(l) { return l.survey_at || l.survey_done_at || null; }
function daysBetween(a, b) {
  if (!a || !b) return null;
  const ms = new Date(b) - new Date(a);
  if (isNaN(ms) || ms < 0) return null;
  return Math.round(ms / 86400000);
}
function sumValues(rows) {
  let total = 0, missing = 0;
  rows.forEach(r => { if (r.quote_total == null) missing++; else total += Number(r.quote_total) || 0; });
  return { total, missing };
}
function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}
/* Leads not archived. Treat a blank archived as not archived */
const NOT_ARCHIVED = 'or=(archived.is.false,archived.is.null)';

/* ── Pipeline stages, in pipeline order, grouped. Colour follows the group everywhere ── */
const STAGES = [
  ['assigned_to_surveyor',            'Assigned to surveyor'],
  ['survey_booked',                   'Survey booked'],
  ['survey_complete',                 'Survey complete'],
  ['quote_in_progress',               'Quote in progress'],
  ['quote_requires_manager_approval', 'Quote needs manager approval'],
  ['quote_submitted',                 'Quote submitted'],
  ['quote_accepted',                  'Quote accepted'],
  ['install_date_confirmed',          'Install date confirmed'],
  ['install_team_assigned',           'Install team assigned'],
  ['install_in_progress',             'Install in progress'],
  ['install_complete',                'Install complete'],
  ['snagging_reported',               'Snagging reported'],
  ['job_complete',                    'Job complete'],
  ['lost',                            'Lost'],
  ['survey_cancelled',                'Survey cancelled'],
];
const STAGE_LABEL = Object.fromEntries(STAGES);
function stageLabel(s) {
  if (!s) return 'No stage';
  return STAGE_LABEL[s] || String(s).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
}
const GROUPS = [
  { key: 'survey',  name: 'Survey',                  color: '#2a78d6', ink: '#ffffff', stages: ['assigned_to_surveyor', 'survey_booked', 'survey_complete'] },
  { key: 'quote',   name: 'Quoting',                 color: '#eb6834', ink: '#ffffff', stages: ['quote_in_progress', 'quote_requires_manager_approval', 'quote_submitted'] },
  { key: 'sold',    name: 'Sold, awaiting install',  color: '#1baf7a', ink: '#ffffff', stages: ['quote_accepted', 'install_date_confirmed', 'install_team_assigned'] },
  { key: 'install', name: 'Installing and snagging', color: '#eda100', ink: '#0b0b0b', stages: ['install_in_progress', 'install_complete', 'snagging_reported'] },
];
const OTHER_GROUP = { key: 'other', name: 'Other', color: '#e87ba4', ink: '#ffffff', stages: [] };
const CLOSED_STAGES = ['job_complete', 'lost', 'survey_cancelled'];
function groupOf(stage) { return GROUPS.find(gr => gr.stages.includes(stage)) || OTHER_GROUP; }

/* ── State ── */
const state = {
  user: null,
  period: 'month',
  anchor: new Date(),
  seq: 0,
  data: null,
  loading: false,
  dataError: '',
  pipe: null,
  pipeError: '',
  openStage: null,
  stageJobs: {},
  show: { closed: false, quoted: false },
  views: {},
};

/* ── Who sees what (Helm tick boxes). Super admins can open every view ── */
function canSee(view) {
  const mods = (state.user && state.user.permitted_modules) || [];
  return mods.includes('admin') || mods.includes('hub-' + view);
}

/* ── Chosen chart per widget, kept on this device ── */
function viewKey(id) { return 'hub.view.' + ((state.user && state.user.id) || 'anon') + '.' + id; }
function getView(w) {
  if (state.views[w.id] && w.views.includes(state.views[w.id])) return state.views[w.id];
  let v = null;
  try { v = localStorage.getItem(viewKey(w.id)); } catch (e) {}
  return v && w.views.includes(v) ? v : w.views[0];
}
function setView(id, v) {
  state.views[id] = v;
  try { localStorage.setItem(viewKey(id), v); } catch (e) {}
}
const VIEW_LABEL = { line: 'Line', columns: 'Columns', bars: 'Bars', pie: 'Pie', split: 'Split', stages: 'Stages', table: 'Table', list: 'List' };

/* ── Periods (local UK time). Weeks run Monday to Sunday ── */
const TREND_N = 12;
const PERIODS = ['day', 'week', 'month', 'quarter'];
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function periodRange(period, anchor) {
  const a = startOfDay(anchor);
  let start, end;
  if (period === 'day') { start = a; end = new Date(a); end.setDate(end.getDate() + 1); }
  else if (period === 'week') {
    const dow = (a.getDay() + 6) % 7;
    start = new Date(a); start.setDate(a.getDate() - dow);
    end = new Date(start); end.setDate(start.getDate() + 7);
  } else if (period === 'month') {
    start = new Date(a.getFullYear(), a.getMonth(), 1);
    end = new Date(a.getFullYear(), a.getMonth() + 1, 1);
  } else {
    const q = Math.floor(a.getMonth() / 3) * 3;
    start = new Date(a.getFullYear(), q, 1);
    end = new Date(a.getFullYear(), q + 3, 1);
  }
  return { start, end };
}
function shiftDate(anchor, period, dir) {
  const a = new Date(anchor);
  if (period === 'day') a.setDate(a.getDate() + dir);
  else if (period === 'week') a.setDate(a.getDate() + 7 * dir);
  else if (period === 'month') a.setMonth(a.getMonth() + dir, 1);
  else a.setMonth(a.getMonth() + 3 * dir, 1);
  return a;
}
function trendRanges(period, anchor) {
  const out = [];
  for (let i = TREND_N - 1; i >= 0; i--) out.push(periodRange(period, shiftDate(anchor, period, -i)));
  return out;
}
function quarterName(d) { return 'Q' + (Math.floor(d.getMonth() / 3) + 1) + ' ' + d.getFullYear(); }
function periodLabel(period, anchor) {
  const { start, end } = periodRange(period, anchor);
  if (period === 'day') return start.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
  if (period === 'month') return start.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const last = new Date(end); last.setDate(end.getDate() - 1);
  if (period === 'quarter') return quarterName(start) + ' (' + start.toLocaleDateString('en-GB', { month: 'short' }) + ' to ' + last.toLocaleDateString('en-GB', { month: 'short' }) + ')';
  return start.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' to ' +
         last.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function tickLabel(range, period) {
  const s = range.start;
  if (period === 'day') return s.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
  if (period === 'month') return s.toLocaleDateString('en-GB', { month: 'short' }) + (s.getMonth() === 0 ? ' ' + String(s.getFullYear()).slice(2) : '');
  if (period === 'quarter') return 'Q' + (Math.floor(s.getMonth() / 3) + 1) + ' ' + String(s.getFullYear()).slice(2);
  return s.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function isCurrentPeriod() {
  return periodRange(state.period, new Date()).start.getTime() === periodRange(state.period, state.anchor).start.getTime();
}
function bucketOf(ranges, iso) {
  if (!iso) return -1;
  const t = new Date(iso).getTime();
  for (let i = 0; i < ranges.length; i++) if (t >= ranges[i].start.getTime() && t < ranges[i].end.getTime()) return i;
  return -1;
}

/* ── Data: the last 12 periods, ending with the chosen one ──
   Sold = the job's install first booked in Scout (install_confirmed note). Scout records Quote Accepted
   in the same minutes as the booking (checked 6 Nov 2026), so the booking is the sale (Neil, option A). */
const LEAD_COLS = 'id,job_id,first_name,last_name,salesperson,status,survey_at,survey_done_at,quote_sent_at,quote_accepted_at,quote_total,install_at';
const QUOTE_VALUES_FROM = new Date('2026-10-15T00:00:00');

async function leadsByIds(ids) {
  const out = [];
  for (const part of chunk(ids, 80)) {
    const rows = await scoutGet('leads', `select=${LEAD_COLS}&id=in.(${part.join(',')})`);
    out.push(...(rows || []));
  }
  return out;
}
async function installNotesFor(ids, extraQs) {
  const out = [];
  for (const part of chunk(ids, 80)) {
    const rows = await scoutGet('lead_activity',
      `select=lead_id,created_at&activity_type=eq.install_confirmed&lead_id=in.(${part.join(',')})${extraQs || ''}&order=created_at.asc`);
    out.push(...(rows || []));
  }
  return out;
}

async function loadData() {
  const seq = ++state.seq;
  state.loading = true; state.dataError = '';
  render();
  const ranges = trendRanges(state.period, state.anchor);
  const s = encodeURIComponent(ranges[0].start.toISOString());
  const e = encodeURIComponent(ranges[ranges.length - 1].end.toISOString());
  try {
    const [quoted, notes] = await Promise.all([
      scoutGet('leads', `select=${LEAD_COLS}&quote_sent_at=gte.${s}&quote_sent_at=lt.${e}&order=quote_sent_at.asc`),
      scoutGet('lead_activity', `select=lead_id,created_at&activity_type=eq.install_confirmed&created_at=gte.${s}&created_at=lt.${e}&order=created_at.asc`),
    ]);
    const firstNote = new Map();
    (notes || []).forEach(n => { if (n.lead_id && !firstNote.has(n.lead_id)) firstNote.set(n.lead_id, n.created_at); });
    let ids = [...firstNote.keys()];
    if (ids.length) {
      const before = new Set((await installNotesFor(ids, `&created_at=lt.${s}`)).map(n => n.lead_id));
      ids = ids.filter(id => !before.has(id));
    }
    const sold = (ids.length ? await leadsByIds(ids) : [])
      .map(l => ({ ...l, sold_at: firstNote.get(l.id) }))
      .sort((a, b) => new Date(a.sold_at) - new Date(b.sold_at));
    if (seq !== state.seq) return;
    state.data = { period: state.period, anchor: new Date(state.anchor), ranges, quoted: quoted || [], sold };
  } catch (err) {
    if (seq !== state.seq) return;
    state.dataError = err.message || 'Could not load figures';
  }
  state.loading = false;
  render();
}

/* Series per period, the chosen period's lists, and a fair comparison with the period before */
function shapeData(d) {
  const blank = () => Array(TREND_N).fill(0);
  const ser = { qN: blank(), qV: blank(), sN: blank(), sV: blank() };
  d.quoted.forEach(l => { const i = bucketOf(d.ranges, l.quote_sent_at); if (i >= 0) { ser.qN[i]++; ser.qV[i] += Number(l.quote_total) || 0; } });
  d.sold.forEach(l => { const i = bucketOf(d.ranges, l.sold_at); if (i >= 0) { ser.sN[i]++; ser.sV[i] += Number(l.quote_total) || 0; } });
  const cur = TREND_N - 1;
  const curR = d.ranges[cur], prevR = d.ranges[cur - 1];
  const now = Date.now();
  const inProgress = now < curR.end.getTime();
  const elapsed = Math.max(0, Math.min(now, curR.end.getTime()) - curR.start.getTime());
  const prevCut = inProgress ? prevR.start.getTime() + elapsed : prevR.end.getTime();
  const inPrev = ts => { const t = new Date(ts).getTime(); return t >= prevR.start.getTime() && t < prevCut; };
  const prev = {
    qN: d.quoted.filter(l => inPrev(l.quote_sent_at)).length,
    sN: d.sold.filter(l => inPrev(l.sold_at)).length,
    sV: d.sold.filter(l => inPrev(l.sold_at)).reduce((a, l) => a + (Number(l.quote_total) || 0), 0),
  };
  /* Charts start at the first period with any data, never fewer than 3 periods */
  let first = 0;
  while (first < cur - 2 && !ser.qN[first] && !ser.sN[first]) first++;
  return {
    ser, prev, inProgress, first,
    quoted: d.quoted.filter(l => bucketOf(d.ranges, l.quote_sent_at) === cur),
    sold: d.sold.filter(l => bucketOf(d.ranges, l.sold_at) === cur),
  };
}
function compareWord(period, inProgress) {
  const w = { day: 'yesterday', week: 'last week', month: 'last month', quarter: 'last quarter' }[period];
  return inProgress ? 'this point ' + w : w;
}

/* ── Data: pipeline now ── */
async function loadPipeline() {
  state.pipe = null; state.pipeError = '';
  render();
  try {
    /* Two columns only. Counted here because PostgREST cannot group without a database function */
    const rows = await scoutGet('leads', `select=status,quote_total&${NOT_ARCHIVED}`);
    const by = new Map();
    (rows || []).forEach(r => {
      const k = r.status || '';
      if (!by.has(k)) by.set(k, { count: 0, value: 0 });
      const b = by.get(k);
      b.count++;
      b.value += Number(r.quote_total) || 0;
    });
    const order = STAGES.map(x => x[0]);
    const keys = [...order.filter(k => by.has(k)), ...[...by.keys()].filter(k => !order.includes(k))];
    state.pipe = { stages: keys.map(k => ({ key: k, ...by.get(k) })) };
  } catch (err) {
    state.pipeError = err.message || 'Could not load the pipeline';
  }
  render();
}
async function loadStageJobs(stage) {
  state.stageJobs[stage] = { loading: true };
  render();
  try {

/* ══════════ Chart builders. SVG and HTML strings, every text value escaped ══════════ */
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function tipAttr(title, rows) {
  return `data-tip-title="${esc(title)}" data-tip-rows="${esc(JSON.stringify(rows))}"`;
}
function axis(svg, pl, pr, w, y, max, fmt) {
  [0, 0.5, 1].forEach(f => {
    const yy = y(max * f);
    svg.push(`<line x1="${pl}" x2="${w - pr}" y1="${yy}" y2="${yy}" stroke="${f === 0 ? 'var(--axis)' : 'var(--grid)'}" stroke-width="1"/>`);
    svg.push(`<text x="${pl - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmt(max * f))}</text>`);
  });
}
/* series: [{ name, color, vals }]; xs: [{ label, title }] */
function lineChart(series, xs, w, h, fmt) {
  const pl = 52, pr = 14, pt = 14, pb = 26, iw = w - pl - pr, ih = h - pt - pb, n = xs.length;
  const max = niceMax(Math.max(1, ...series.flatMap(sr => sr.vals)));
  const x = i => pl + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
  const y = v => pt + ih - (v / max) * ih;
  const svg = [`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(s => s.name).join(' and '))}">`];
  axis(svg, pl, pr, w, y, max, fmt);
  const every = iw / n < 44 ? 2 : 1;
  xs.forEach((xx, i) => { if ((n - 1 - i) % every === 0) svg.push(`<text x="${x(i)}" y="${h - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(xx.label)}</text>`); });
  series.forEach(sr => {
    svg.push(`<path d="${sr.vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
    svg.push(`<circle cx="${x(n - 1)}" cy="${y(sr.vals[n - 1])}" r="4" fill="${sr.color}" stroke="var(--surface)" stroke-width="2"/>`);
  });
  xs.forEach((xx, i) => {
    const half = n === 1 ? iw / 2 : iw / (n - 1) / 2;
    const left = Math.max(pl, x(i) - half);
    svg.push(`<g class="hit-g" ${tipAttr(xx.title, series.map(sr => [sr.name, fmt(sr.vals[i]), sr.color]))}>
      <line class="xh" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt + ih}" stroke="var(--axis)" stroke-width="1"/>
      <rect class="hit" x="${left}" y="${pt}" width="${Math.min(half * 2, w - pr - left)}" height="${ih}"/></g>`);
  });
  return svg.join('') + '</svg>';
}
function barPath(x0, bw, top, base) {
  const hgt = base - top;
  if (hgt <= 0) return '';
  const r = Math.min(4, hgt);
  return `M${x0},${base} L${x0},${top + r} Q${x0},${top} ${x0 + r},${top} L${x0 + bw - r},${top} Q${x0 + bw},${top} ${x0 + bw},${top + r} L${x0 + bw},${base} Z`;
}
/* Columns for one or two series. One series: the last column is the accent, the rest recede */
function columnChart(series, xs, w, h, fmt, opts = {}) {
  const pl = 52, pr = 10, pt = 18, pb = 26, iw = w - pl - pr, ih = h - pt - pb, n = xs.length, k = series.length;
  const max = niceMax(Math.max(opts.minMax || 1, ...series.flatMap(sr => sr.vals)));
  const band = iw / n, bw = Math.min(24, (band * 0.7 - (k - 1) * 2) / k);
  const y = v => pt + ih - (v / max) * ih, base = pt + ih;
  const svg = [`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(s => s.name).join(' and '))}">`];
  axis(svg, pl, pr, w, y, max, fmt);
  const every = band < 40 ? 2 : 1;
  xs.forEach((xx, i) => {
    const groupW = k * bw + (k - 1) * 2, gx = pl + band * i + (band - groupW) / 2;
    let marks = '';
    series.forEach((sr, j) => {
      const fill = k === 1 && opts.emphasiseLast ? (i === n - 1 ? sr.color : 'var(--deemph)') : sr.color;
      const p = barPath(gx + j * (bw + 2), bw, y(sr.vals[i]), base);
      if (p) marks += `<path class="bar-mark" d="${p}" fill="${fill}"/>`;
    });
    svg.push(`<g class="hit-g" ${tipAttr(xx.title, series.map(sr => [sr.name, fmt(sr.vals[i]), sr.color]).concat(opts.extraTip ? [opts.extraTip(i)] : []))}>${marks}
      <rect class="hit" x="${pl + band * i}" y="${pt}" width="${band}" height="${ih}"/></g>`);
    if (k === 1 && opts.emphasiseLast && i === n - 1) svg.push(`<text x="${pl + band * i + band / 2}" y="${y(series[0].vals[i]) - 5}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${esc(fmt(series[0].vals[i]))}</text>`);
    if ((n - 1 - i) % every === 0) svg.push(`<text x="${pl + band * i + band / 2}" y="${h - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(xx.label)}</text>`);
  });
  return svg.join('') + '</svg>';
}
/* Ranked horizontal bars. rows: [{ name, value, text, tip }] */
function hBars(rows, color) {
  if (!rows.length) return '<div class="empty">Nothing to show.</div>';
  const max = Math.max(1, ...rows.map(r => r.value));
  return '<div class="rank">' + rows.map(r => `<div class="r-name" title="${esc(r.name)}">${esc(r.name)}</div>
    <div class="r-track" ${tipAttr(r.name, r.tip)}><span style="width:${(r.value / max * 100).toFixed(1)}%;background:${r.color || color}"></span></div>
    <div class="r-val">${r.text}</div>`).join('') + '</div>';
}
/* Vertical bars for categories. rows as hBars */
function vBars(rows, color, w, h, fmt) {
  if (!rows.length) return '<div class="empty">Nothing to show.</div>';
  return columnChart([{ name: 'Value', color, vals: rows.map(r => r.value) }],
    rows.map(r => ({ label: r.name.length > 10 ? r.name.slice(0, 9) + '.' : r.name, title: r.name })), w, h, fmt);
}
/* Pie for a split of up to 5 parts. parts: [{ name, count, value, color }] */
function pieChart(parts, size) {
  const live = parts.filter(p => p.count > 0);
  const total = live.reduce((a, p) => a + p.count, 0) || 1;
  const r = size / 2 - 2, c = size / 2;
  let a0 = -Math.PI / 2, paths = '';
  live.forEach(p => {
    const a1 = a0 + (p.count / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const d = live.length === 1
      ? `M${c},${c - r} A${r},${r} 0 1 1 ${c - 0.01},${c - r} Z`
      : `M${c},${c} L${c + r * Math.cos(a0)},${c + r * Math.sin(a0)} A${r},${r} 0 ${large} 1 ${c + r * Math.cos(a1)},${c + r * Math.sin(a1)} Z`;
    paths += `<path class="bar-mark" d="${d}" fill="${p.color}" stroke="var(--surface)" stroke-width="2" ${tipAttr(p.name, [['Leads', String(p.count), p.color], ['Share', Math.round(p.count / total * 100) + '%', ''], ['Quoted value', money(p.value), '']])}/>`;
    a0 = a1;
  });
  const legend = live.map(p => `<div class="pie-row"><i style="background:${p.color}"></i><span>${esc(p.name)}</span><b>${p.count}</b><em>${Math.round(p.count / total * 100)}%</em></div>`).join('');
  return `<div class="pie-wrap"><svg width="${size}" height="${size}" role="img" aria-label="${esc(live.map(p => p.name + ' ' + p.count).join(', '))}">${paths}</svg><div class="pie-legend">${legend}</div></div>`;
}
/* Tall split bar for one whole */
function splitBar(parts, width) {
  const live = parts.filter(p => p.count > 0);
  const total = live.reduce((a, p) => a + p.count, 0) || 1;
  const blocks = live.map(p => {
    const label = String(p.count), fits = (p.count / total) * width > label.length * 8 + 18;
    return `<div ${tipAttr(p.name, [['Leads', String(p.count), p.color], ['Share', Math.round(p.count / total * 100) + '%', ''], ['Quoted value', money(p.value), '']])}
      style="flex:${p.count} 1 0;background:${p.color};color:${p.ink};">${fits ? esc(label) : ''}</div>`;
  }).join('');
  return `<div class="segbar" role="img" aria-label="${esc(live.map(p => p.name + ' ' + p.count).join(', '))}">${blocks}</div>
    <div class="legend">${live.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name)}</span>`).join('')}</div>`;
}
function sparkline(vals, color) {
  const w = 84, h = 28, n = vals.length, max = Math.max(1, ...vals);
  if (n < 2) return '';
  const x = i => 2 + (i * (w - 6)) / (n - 1), y = v => h - 3 - (v / max) * (h - 8);
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--deemph)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${x(n - 1)}" cy="${y(vals[n - 1])}" r="3" fill="${color}"/></svg>`;
}
/* Cells are already escaped HTML. A cell given as [html, 'num'] is right-aligned */
function table(headers, rows, totalRow, emptyText) {
  if (!rows.length) return `<div class="empty">${esc(emptyText || 'None.')}</div>`;
  const th = headers.map(h => Array.isArray(h) ? `<th class="${h[1]}">${esc(h[0])}</th>` : `<th>${esc(h)}</th>`).join('');
  const tr = cells => cells.map(c => Array.isArray(c) ? `<td class="${c[1]}">${c[0]}</td>` : `<td>${c}</td>`).join('');
  const tot = totalRow ? `<tr class="total">${tr(totalRow.map(c => Array.isArray(c) ? c : esc(c)))}</tr>` : '';
  return `<div class="tbl-wrap"><table><thead><tr>${th}</tr></thead><tbody>${rows.map(r => `<tr>${tr(r)}</tr>`).join('')}${tot}</tbody></table></div>`;
}

        ctx.open.map(s => [esc(stageLabel(s.key)), esc(groupOf(s.key).name), [String(s.count), 'num'], [esc(money(s.value)), 'num']]), null);
      const max = Math.max(1, ...ctx.open.map(s => s.count));
      let html = ctx.open.map(s => stageRow(s, max, groupOf(s.key).color)).join('');
      html += `<div style="margin-top:12px"><button class="link" data-action="toggle" data-key="closed">${state.show.closed ? 'Hide closed jobs' : 'Show closed jobs (' + ctx.closedN.toLocaleString('en-GB') + ')'}</button></div>`;
      if (state.show.closed) html += ctx.closed.map(s => stageRow(s, Math.max(1, ...ctx.closed.map(x => x.count)), 'var(--deemph)')).join('');
      return html;
    },
  },
};
function widgetCard(w, ctx, extraClass) {
  const view = getView(w);
  const menu = w.views.length > 1 ? `<div class="vsw" role="group" aria-label="Chart type">${w.views.map(v =>
    `<button data-action="view" data-widget="${w.id}" data-view="${v}" class="${v === view ? 'on' : ''}">${VIEW_LABEL[v]}</button>`).join('')}</div>` : '';
  return `<div class="card ${extraClass || ''}"><div class="card-head"><div><h2>${esc(w.title)}</h2><p class="hint">${esc(w.hint(ctx))}</p></div>${menu}</div>${w.body(view, ctx)}</div>`;
}

/* ══════════ Render ══════════ */
function render() {
  const root = g('root');
  if (!state.user) { root.innerHTML = '<div class="gate">Open Hub from Helm to see your dashboard.</div>'; return; }
  if (!canSee('exec')) {
    root.innerHTML = head() + `<div class="gate">Hi ${esc((state.user.name || '').split(' ')[0])}. Your dashboard is on its way.</div>`;
    return;
  }
  root.innerHTML = head() + renderSales() + renderPipeline();
}
function head() {
  return `<div class="app-head"><div class="app-name">Hub</div><div class="app-ver">${esc(APP_VERSION)}</div><div class="app-view">CEO view</div></div>`;
}
function innerWidth(cols) {
  const W = Math.min(document.documentElement.clientWidth || g('root').clientWidth || 360, 1140) - (window.innerWidth <= 560 ? 24 : 32);
  const twoCol = cols === 2 && W >= 728;
  return Math.max(260, Math.floor((twoCol ? (W - 14) / 2 : W) - 38));
}

function renderSales() {
  const p = state.period;
  const seg = PERIODS.map(k => `<button data-action="period" data-period="${k}" class="${p === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('');
  let html = `<div class="section-title">Sales and installs</div>
    <div class="controls">
      <div class="seg">${seg}</div>
      <button class="btn" data-action="prev" aria-label="Previous">&#8249;</button>
      <div class="period-label">${esc(periodLabel(p, state.anchor))}</div>
      <button class="btn" data-action="next" aria-label="Next" ${isCurrentPeriod() ? 'disabled' : ''}>&#8250;</button>
      ${isCurrentPeriod() ? '' : '<button class="btn" data-action="today">Back to now</button>'}
    </div>`;
  if (state.dataError) return html + `<div class="err">Could not load the figures: ${esc(state.dataError)} <button class="btn" data-action="retry-data">Try again</button></div>`;
  const d = state.data;
  if (!d) return html + '<div class="loading">Loading figures</div>';
  const sh = shapeData(d);
  const cur = TREND_N - 1, f = sh.first;
  const word = compareWord(d.period, sh.inProgress);
  const sold = sumValues(sh.sold), quoted = sumValues(sh.quoted);
  const withValue = sh.sold.filter(l => l.quote_total != null);
  const avg = withValue.length ? sold.total / withValue.length : null;
  const days = sh.sold.map(l => daysBetween(surveyDate(l), l.sold_at)).filter(x => x != null);
  const avgDays = days.length ? Math.round(days.reduce((a, x) => a + x, 0) / days.length) : null;
  const pct = quoted.total ? Math.min(100, Math.round(sold.total / quoted.total * 100)) : null;
  const sl = arr => arr.slice(f);

  html += `<div class="${state.loading ? 'stale' : ''}"><div class="tiles">
    ${tile('Sold (installs booked)', String(sh.ser.sN[cur]), money(sh.ser.sV[cur]), delta(sh.ser.sN[cur], sh.prev.sN, word), sparkline(sl(sh.ser.sN), 'var(--s1)'), sold.missing, sh.inProgress)}
    ${tile('Quotes sent', String(sh.ser.qN[cur]), money(sh.ser.qV[cur]), delta(sh.ser.qN[cur], sh.prev.qN, word), sparkline(sl(sh.ser.qV), 'var(--s1)'), quoted.missing, sh.inProgress)}
    <div class="tile"><div class="t-label">Sold against quoted${sh.inProgress ? ' so far' : ''}</div>
      <div class="t-value">${pct == null ? '<span class="t-none">No quotes</span>' : pct + '%'}</div>
      <div class="meter" role="img" aria-label="${pct || 0} percent"><span style="width:${pct || 0}%"></span></div>
      <div class="t-note">${esc(money(sold.total))} sold of ${esc(money(quoted.total))} quoted</div>
    </div>
    <div class="tile"><div class="t-label">Average sale${sh.inProgress ? ' so far' : ''}</div>
      <div class="t-value">${avg == null ? '<span class="t-none">No sales</span>' : esc(money(avg))}</div>
      <div class="t-note">Survey to install booked: ${avgDays == null ? 'no survey dates' : esc(avgDays + ' days on average')}</div>
      ${days.length < sh.sold.length ? `<div class="t-note">${days.length} of ${sh.sold.length} jobs have a survey date</div>` : ''}
    </div>
  </div>`;

  const ctx = {
    period: d.period, periodCap: d.period[0].toUpperCase() + d.period.slice(1),
    xs: d.ranges.slice(f).map(r => ({ label: tickLabel(r, d.period), title: periodLabel(d.period, r.start) })),
    qN: sl(sh.ser.qN), qV: sl(sh.ser.qV), sN: sl(sh.ser.sN), sV: sl(sh.ser.sV),
    w1: innerWidth(1), w2: innerWidth(2), bySurveyor: surveyorRows(sh),
  };
  const early = d.ranges[f].start < QUOTE_VALUES_FROM;
  html += `<div class="grid-2">${widgetCard(WIDGETS.value, ctx)}${widgetCard(WIDGETS.sold, ctx)}</div>`;
  if (early || f > 0) html += `<p class="data-note">${f > 0 ? 'Charts start at the first ' + esc(d.period) + ' with data in Scout. ' : ''}${early ? 'Quote values are only recorded from mid-October 2026, so £ figures before then are low.' : ''}</p>`;

  html += `<div class="card"><h2>Sold this ${esc(d.period)}: ${sh.sold.length}</h2><p class="hint">Installs booked in Scout, oldest first. Value is the last quote emailed.</p>
    ${table(['Booked on', 'Job ID', 'Customer', 'Surveyor', 'Survey', ['Days', 'num'], 'Install date', ['Value', 'num']],
      sh.sold.map(l => { const dd = daysBetween(surveyDate(l), l.sold_at);
        return [dateTime(l.sold_at), jobId(l), esc(custName(l)), surveyor(l), dateShort(surveyDate(l)), [dd == null ? NR : String(dd), 'num'], dateShort(l.install_at), [moneyOrNr(l.quote_total), 'num']]; }),
      sh.sold.length ? ['Total', sh.sold.length + ' jobs', '', '', '', '', '', [esc(money(sold.total)), 'num']] : null, 'No installs booked this ' + d.period + '.')}</div>`;

  html += widgetCard(WIDGETS.surveyors, ctx);

  const qOpen = state.show.quoted;
  html += `<div class="card"><h2>Quotes sent this ${esc(d.period)}: ${sh.quoted.length}</h2><p class="hint">Jobs whose latest quote was emailed. A quote sent again moves to the newer date.</p>
    ${sh.quoted.length ? `<button class="link" data-action="toggle" data-key="quoted">${qOpen ? 'Hide the jobs' : 'Show the ' + sh.quoted.length + ' jobs'}</button>` : '<div class="empty">None.</div>'}
    ${qOpen && sh.quoted.length ? '<div style="margin-top:10px">' + table(['Sent', 'Job ID', 'Customer', 'Surveyor', 'Stage now', ['Value', 'num']],
      sh.quoted.map(l => [dateShort(l.quote_sent_at), jobId(l), esc(custName(l)), surveyor(l), `<span class="pill">${esc(stageLabel(l.status))}</span>`, [moneyOrNr(l.quote_total), 'num']]),
      ['Total', sh.quoted.length + ' quotes', '', '', '', [esc(money(quoted.total)), 'num']], '') + '</div>' : ''}</div>`;
  return html + '</div>';
}

function delta(nowV, prevV, word) {
  const diff = nowV - prevV;
  if (diff > 0) return { cls: 'up', text: `▲ ${diff} more than ${word}` };
  if (diff < 0) return { cls: 'down', text: `▼ ${-diff} fewer than ${word}` };
  return { cls: 'flat', text: `Same as ${word}` };
}
function tile(label, value, sub, dl, spark, missing, soFar) {
  return `<div class="tile"><div class="t-label">${esc(label)}${soFar ? ' so far' : ''}</div>
    <div class="t-row"><div class="t-value">${esc(value)}</div>${spark}</div>
    <div class="t-sub">${esc(sub)}</div>
    <div class="t-delta ${dl.cls}">${esc(dl.text)}</div>
    ${missing ? `<div class="t-note">${missing} with no value recorded</div>` : ''}</div>`;
}
function surveyorRows(sh) {
  const m = new Map();
  const row = name => { const k = name || 'No salesperson'; if (!m.has(k)) m.set(k, { name: k, q: 0, qv: 0, s: 0, sv: 0 }); return m.get(k); };
  sh.quoted.forEach(l => { const r = row(l.salesperson); r.q++; r.qv += Number(l.quote_total) || 0; });
  sh.sold.forEach(l => { const r = row(l.salesperson); r.s++; r.sv += Number(l.quote_total) || 0; });
  return [...m.values()].sort((a, b) => b.sv - a.sv || b.qv - a.qv);
}

function renderPipeline() {
  let html = '<div class="section-title">Pipeline now</div>';
  if (state.pipeError) return html + `<div class="err">Could not load the pipeline: ${esc(state.pipeError)} <button class="btn" data-action="retry-pipe">Try again</button></div>`;
  const p = state.pipe;
  if (!p) return html + '<div class="loading">Loading pipeline</div>';
  const open = p.stages.filter(s => !CLOSED_STAGES.includes(s.key));
  const closed = p.stages.filter(s => CLOSED_STAGES.includes(s.key));
  const openN = open.reduce((a, s) => a + s.count, 0);
  const openV = open.reduce((a, s) => a + s.value, 0);
  const parts = [...GROUPS, OTHER_GROUP].map(gr => {
    const ss = open.filter(s => groupOf(s.key) === gr);
    return { name: gr.name, color: gr.color, ink: gr.ink, count: ss.reduce((a, s) => a + s.count, 0), value: ss.reduce((a, s) => a + s.value, 0) };
  });
  const ctx = { open, closed, openN, parts, closedN: closed.reduce((a, s) => a + s.count, 0), w1: innerWidth(1) };
  html += `<div class="card"><div class="pipe-head">
      <div><div class="lbl">Open leads</div><div class="big">${openN.toLocaleString('en-GB')}</div></div>
      <div><div class="lbl">Quoted value of open leads</div><div class="big">${esc(money(openV))}</div></div>
    </div><p class="hint" style="margin:4px 0 0">Every lead in Scout that isn't archived, closed or lost, however old.</p></div>`;
  html += widgetCard(WIDGETS.split, ctx) + widgetCard(WIDGETS.stages, ctx);
  return html;
}
function stageRow(s, max, color) {
  const isOpen = state.openStage === s.key;
  return `<div class="stage-row ${isOpen ? 'open' : ''}" data-action="stage" data-stage="${esc(s.key)}">
      <div class="s-name"><i style="background:${color}"></i>${esc(stageLabel(s.key))}</div>
      <div class="s-bar"><span style="width:${(s.count / max * 100).toFixed(1)}%;background:${color}"></span></div>
      <div class="s-count">${s.count}</div>
      <div class="s-val">${s.value ? esc(moneyShort(s.value)) : ''}</div>
      <div data-arrow>&#8250;</div>
    </div>${isOpen ? `<div class="stage-jobs">${renderStageJobs(s.key)}</div>` : ''}`;
}
function renderStageJobs(stage) {
  const sj = state.stageJobs[stage];
  if (!sj || sj.loading) return '<div class="loading">Loading jobs</div>';
  if (sj.error) return `<div class="err">${esc(sj.error)}</div>`;
  const note = sj.rows.length === 300 ? '<p class="hint">Showing the newest 300.</p>' : '';
  return note + table(['Job ID', 'Customer', 'Surveyor', 'Survey', 'Quote sent', 'Lead added', ['Value', 'num']],
    sj.rows.map(l => [jobId(l), esc(custName(l)), surveyor(l), dateShort(surveyDate(l)),
                      l.quote_sent_at ? dateShort(l.quote_sent_at) : '<span class="nr">Not sent</span>',
                      dateShort(l.created_at), [moneyOrNr(l.quote_total), 'num']]), null, 'No jobs at this stage.');
}

/* ── Tooltip: built with textContent from data attributes ── */
function showTip(target, ev) {
  const tip = g('tip');
  let rows = [];
  try { rows = JSON.parse(target.getAttribute('data-tip-rows') || '[]'); } catch (e) {}
  tip.textContent = '';
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = target.getAttribute('data-tip-title') || ''; tip.appendChild(t);
  rows.forEach(([label, value, color]) => {
    const r = document.createElement('div'); r.className = 'tr';
    const s = document.createElement('span');
    if (color) { const i = document.createElement('i'); i.style.background = color; s.appendChild(i); }
    s.appendChild(document.createTextNode(label));
    const b = document.createElement('b'); b.textContent = value;
    r.appendChild(s); r.appendChild(b); tip.appendChild(r);
  });
  tip.style.display = 'block';
  const bw = document.body.clientWidth, tw = tip.offsetWidth;
  let left = ev.pageX + 14; if (left + tw > bw - 8) left = ev.pageX - tw - 14;
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = (ev.pageY + 14) + 'px';
}
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip-title]');
  if (t) showTip(t, e); else g('tip').style.display = 'none';
});
document.addEventListener('pointerleave', () => { g('tip').style.display = 'none'; });

/* ── Events ── */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  const a = btn.dataset.action;
  if (a === 'period') { state.period = btn.dataset.period; state.anchor = new Date(); loadData(); }
  else if (a === 'prev') { state.anchor = shiftDate(state.anchor, state.period, -1); loadData(); }
  else if (a === 'next') { if (!isCurrentPeriod()) { state.anchor = shiftDate(state.anchor, state.period, 1); loadData(); } }
  else if (a === 'today') { state.anchor = new Date(); loadData(); }
  else if (a === 'retry-data') loadData();
  else if (a === 'retry-pipe') loadPipeline();
  else if (a === 'view') { setView(btn.dataset.widget, btn.dataset.view); render(); }
  else if (a === 'toggle') { const k = btn.dataset.key; state.show[k] = !state.show[k]; render(); }
  else if (a === 'stage') {
    const st = btn.dataset.stage;
    if (state.openStage === st) { state.openStage = null; render(); return; }
    state.openStage = st;
    try { history.pushState({ page: 'stage' }, ''); } catch (err) {}
    loadStageJobs(st);
  }
});

/* Charts are drawn to the width available. Redraw after a resize settles */
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.user) render(); }, 150); });

/* Android back closes an open stage list */
try { history.replaceState({ page: 'home' }, ''); } catch (e) {}
window.addEventListener('popstate', () => {
  try { state.openStage = null; render(); } catch (err) {}
});

/* ── Helm hands over the signed-in user ── */
window.addEventListener('message', e => {
  if (e.origin !== 'https://i3rink.github.io') return;
  const msg = e.data || {};
  if (msg.type !== 'HELM_USER' || !msg.user) return;
  const first = !state.user || state.user.id !== msg.user.id;
  state.user = msg.user;
  if (first) { state.views = {}; state.openStage = null; state.stageJobs = {}; }
  if (first && canSee('exec')) {
    state.anchor = new Date();
    loadData();
    loadPipeline();
  } else {
    render();
  }
});
</script>
</body>
</html>
